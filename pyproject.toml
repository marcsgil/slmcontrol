[project]
name = "slmcontrol"
version = "0.4.0"
description = "Add your description here"
readme = "docs/README.md"
authors = [
    { name = "Marcos Gil", email = "marcosgildeoliveira@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2",
    "opencv-python>=4.12",
    "scipy>=1.15",
    "screeninfo>=0.8",
    "tqdm>=4.67.3",
]

[project.scripts]
slmcontrol-server = "slmcontrol.server:_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.1",
    "mkdocs-material>=9.6.9",
    "mkdocstrings-python>=1.16.8",
    "pytest>=9.0.3",
]
